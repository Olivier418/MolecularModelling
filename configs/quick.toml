# A small, fast run (about a minute) to try things out. Settings not listed
# here take their default values (see default.toml).
seed = 1

[system]
boxsize = 2.0
weights = { Water = 1.0, Ethanol = 1.0 }

[integration]
end_time = 5.0
save_steps = 20

[output]
directory = "../trajectories"
show_plots = false

[rdf]
dr = 0.01
gif_frames = 50
